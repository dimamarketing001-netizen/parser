server {
    server_name xn--80ak2afbe.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai;

    client_max_body_size 20m;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
    try_files $uri =404;
}

    location /app/ {
        alias /var/www/parsya-ads/;
        try_files $uri $uri/ /app/index.html;
    }

    location = /api/relay/telegram-alert {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/relay/telegram-captcha {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 2026-11-03: must stay cleared on THIS (native) domain. app/main.py
        # trusts X-Forwarded-Prefix both to rewrite its own links AND to
        # auto-authenticate a session (assuming it only ever arrives via
        # addAvto's own reverse proxy, which sits behind Basic Auth) — a
        # client sending this header directly here would otherwise log
        # itself in for free. Always overwrite, never pass through.
        proxy_set_header X-Forwarded-Prefix "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    listen 62.109.6.186:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xn--80ak2afbe.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xn--80ak2afbe.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = xn--80ak2afbe.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen 62.109.6.186:80;
    server_name xn--80ak2afbe.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai;
    return 404; # managed by Certbot


}
